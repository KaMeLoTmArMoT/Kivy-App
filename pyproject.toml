[project]
name = "kivy-app"
version = "0.1.0"
description = "Kivy App for Image Management and Machine Learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kivy==2.3.1",
    "kivymd @ git+https://github.com/kivymd/KivyMD.git@master",
    "numpy==1.26.4",
    "pycryptodomex==3.19.1",
    "opencv-python==4.7.0.72",
    "checksumdir==1.2.0",
    "setuptools<71",
    "scikit-learn==1.5.2",
    "tensorboard==2.19.0",
    "tqdm==4.66.1",
    "onnx==1.17.0",
    "onnxruntime-gpu==1.22.0",
    "onnxslim==0.1.59",
    "tensorrt==10.12.0.36",
    "ultralytics==8.3.172",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest==9.0.2",
    "pytest-timeout==2.4.0",
    "pytest-cov==7.0.0",
    "pytest-kivy==0.1.0.dev2",
    "coverage==7.13.0",
    "python-dotenv==1.2.1",
    "pre-commit==4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
