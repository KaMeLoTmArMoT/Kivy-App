name: tests-minimal

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      SDL_VIDEODRIVER: "x11"

      APP_ENV: test
      APP_DEV_PASSWORD: "test-password-123456"
      APP_AUTOLOGIN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Xvfb + mtdev)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1

      - name: Install Python deps via uv
        run: |
          uv sync

      - name: Run tests (headless X)
        run: |
          xvfb-run -a uv run pytest --timeout 30 -v -s \
            app/tests/integration/test_1_screen_navigation.py \
            app/tests/integration/test_2_auth_flow.py \
            app/tests/integration/test_3_test_main_crud_flow.py \
            app/tests/integration/test_4_images_flow.py \
            app/tests/integration/test_5_db_images_split.py
