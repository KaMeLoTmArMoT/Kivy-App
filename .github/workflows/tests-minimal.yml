name: tests-minimal

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Keep CI stable/noisy-less for Kivy
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      # Optional: helps some headless setups; harmless if unused
      SDL_VIDEODRIVER: "x11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements-test.txt

      - name: Install system deps (Xvfb + mtdev)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-test.txt

      - name: Run tests (headless X)
        run: |
          xvfb-run -a pytest --timeout 20 -v -s \
            app/tests/integration/test_1_screen_navigation.py \
            app/tests/integration/test_2_auth_flow.py \
            app/tests/integration/test_3_test_main_crud_flow.py \
            app/tests/integration/test_4_images_flow.py \
            app/tests/integration/test_5_db_images_split.py
