name: Tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check --no-cache app main.py
      - run: uv run pytest --timeout 30 -m "not slow" -q

  slow-ml:
    runs-on: windows-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest --timeout 300 -m slow -q
